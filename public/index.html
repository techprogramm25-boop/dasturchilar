<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_CORE // Global Enterprise Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Socket.io Client -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appleDark: '#030712',
                        appleCard: 'rgba(15, 23, 42, 0.9)',
                        appleBorder: 'rgba(255, 255, 255, 0.08)',
                        cyberGreen: '#00ff66',
                        cyberBlue: '#00f0ff',
                    },
                    keyframes: {
                        appleBounce: {
                            '0%': { opacity: '0', transform: 'translateY(20px) scale(0.95)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        }
                    },
                    animation: {
                        'apple-bounce': 'appleBounce 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(13, 18, 32, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyberGreen selection:text-black">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full border border-appleBorder space-y-4 animate-apple-bounce shadow-2xl">
            <div class="text-center space-y-1">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyberGreen to-cyberBlue mx-auto flex items-center justify-center text-black font-bold">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <h2 class="text-sm font-bold text-white tracking-tight">Tizimga Kirish</h2>
                <p class="text-slate-400 text-[11px]">Global tarmoqqa ulaning.</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] font-mono text-slate-400 mb-1 uppercase">Ism va Familiya</label>
                    <input type="text" id="auth-name" required placeholder="Yusufxon Axmatov" class="w-full bg-black/50 border border-appleBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyberGreen">
                </div>
                <div>
                    <label class="block text-[10px] font-mono text-slate-400 mb-1 uppercase">Telefon (+998)</label>
                    <input type="text" id="auth-phone" required placeholder="+998 (90) - 123 - 45 - 67" oninput="formatPhone(this)" class="w-full bg-black/50 border border-appleBorder rounded-xl px-3 py-2 text-xs font-mono text-cyberGreen focus:outline-none focus:border-cyberGreen">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-cyberGreen text-black font-semibold text-xs hover:opacity-90 transition">Ulanish</button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-wrapper" class="hidden min-h-screen flex flex-col">
        <header class="sticky top-0 z-40 glass-panel border-b border-appleBorder px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 rounded-lg bg-cyberGreen flex items-center justify-center text-black font-bold">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                </div>
                <span class="text-xs font-bold tracking-wider text-white">CYBER_CORE</span>
            </div>

            <nav class="flex items-center space-x-1 bg-black/40 p-1 rounded-xl border border-appleBorder text-xs">
                <button onclick="switchTab('overview')" id="nav-overview" class="px-3 py-1.5 rounded-lg font-medium text-white bg-white/10 transition">Asosiy</button>
                <button onclick="switchTab('chat')" id="nav-chat" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">Chat</button>
                <button onclick="switchTab('battle')" id="nav-battle" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition">Battle</button>
            </nav>

            <div class="flex items-center space-x-3 text-xs font-mono">
                <span class="px-2.5 py-1 rounded-full bg-cyberGreen/10 border border-cyberGreen/20 text-cyberGreen">
                    Online: <strong id="real-online-count" class="text-white">0</strong>
                </span>
            </div>
        </header>

        <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4">
            <!-- OVERVIEW -->
            <section id="tab-overview" class="space-y-4 animate-apple-bounce">
                <div class="glass-panel p-6 rounded-2xl space-y-3">
                    <h1 class="text-xl font-bold text-white">Global Tarmoq Faol</h1>
                    <p class="text-slate-400 text-xs leading-relaxed">Hamma qurilmalar bir serverga ulangan. Chat bo'limiga o'tib istalgan davlatdan yozishni boshlang.</p>
                </div>
            </section>

            <!-- CHAT (Ixchamlashtirilgan, ekranga sig'adigan va chiroyli) -->
            <section id="tab-chat" class="hidden space-y-3 animate-apple-bounce">
                <div class="glass-panel p-4 rounded-2xl h-[520px] flex flex-col justify-between">
                    <!-- Xonalar -->
                    <div class="flex items-center justify-between pb-3 border-b border-appleBorder gap-2 overflow-x-auto">
                        <span class="text-[11px] font-mono text-slate-400 uppercase">Xonalar:</span>
                        <div class="flex gap-1.5">
                            <button onclick="changeRoom('python')" class="room-btn px-2.5 py-1 rounded-lg bg-cyberGreen text-black text-[11px] font-semibold">Python</button>
                            <button onclick="changeRoom('javascript')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-slate-300 text-[11px]">JS</button>
                            <button onclick="changeRoom('csharp')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-slate-300 text-[11px]">C#</button>
                            <button onclick="changeRoom('lua')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-slate-300 text-[11px]">Lua</button>
                            <button onclick="changeRoom('security')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-rose-400 text-[11px]">Xakerlik</button>
                        </div>
                    </div>

                    <!-- Xabarlar oynasi (Ixcham va sig'adigan) -->
                    <div id="chat-messages-box" class="flex-1 overflow-y-auto space-y-2.5 py-3 pr-1 text-xs"></div>

                    <!-- Yozish joyi -->
                    <form onsubmit="sendChatMessage(event)" class="pt-3 border-t border-appleBorder flex items-center space-x-2">
                        <input type="text" id="chat-input-field" placeholder="Xabar yozing..." class="flex-1 bg-black/40 border border-appleBorder rounded-xl px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-cyberGreen">
                        <button type="submit" class="px-4 py-2 rounded-xl bg-cyberGreen text-black font-semibold text-xs hover:opacity-90 transition">Yuborish</button>
                    </form>
                </div>
            </section>

            <!-- BATTLE -->
            <section id="tab-battle" class="hidden space-y-4 animate-apple-bounce">
                <div class="glass-panel p-6 rounded-2xl space-y-3">
                    <h2 class="text-base font-bold text-white">Code Battle Arena</h2>
                    <textarea id="battle-code" class="w-full h-32 bg-black/60 border border-appleBorder rounded-xl p-3 code-font text-xs text-cyberGreen" placeholder="// Kodni yozing..."></textarea>
                    <button onclick="submitBattle()" class="px-4 py-2 rounded-xl bg-cyberGreen text-black font-semibold text-xs">Tarqatish</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Script Logic -->
    <script>
        const socket = io();
        let currentUser = null;
        let currentRoom = 'python';

        socket.on('online-count', (count) => {
            document.getElementById('real-online-count').innerText = count;
        });

        socket.on('room-history', (messages) => {
            const box = document.getElementById('chat-messages-box');
            box.innerHTML = '';
            messages.forEach(msg => appendMsg(msg.sender, msg.text, msg.id === socket.id));
        });

        socket.on('new-message', (data) => {
            appendMsg(data.sender, data.text, data.id === socket.id);
        });

        function formatPhone(input) {
            let val = input.value.replace(/\D/g, '');
            if (val.startsWith('998')) val = val.slice(3);
            val = val.substring(0, 9);
            let formatted = '+998 ';
            if (val.length > 0) formatted += '(' + val.substring(0, 2);
            if (val.length >= 2) formatted += ') - ';
            if (val.length > 2) formatted += val.substring(2, 5);
            if (val.length >= 5) formatted += ' - ';
            if (val.length > 5) formatted += val.substring(5, 7);
            if (val.length >= 7) formatted += ' - ';
            if (val.length > 7) formatted += val.substring(7, 9);
            input.value = formatted;
        }

        function handleLogin(e) {
            e.preventDefault();
            const name = document.getElementById('auth-name').value.trim();
            const phone = document.getElementById('auth-phone').value.trim();
            if (!name || phone.length < 25) return alert("Ma'lumotlarni to'liq kiriting!");

            currentUser = { name, phone };
            socket.emit('join-platform', currentUser);
            socket.emit('join-room', currentRoom);

            document.getElementById('login-modal').classList.add('hidden');
            document.getElementById('app-wrapper').classList.remove('hidden');
            lucide.createIcons();
        }

        function switchTab(id) {
            ['overview', 'chat', 'battle'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('nav-' + t).className = "px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition";
            });
            document.getElementById('tab-' + id).classList.remove('hidden');
            document.getElementById('nav-' + id).className = "px-3 py-1.5 rounded-lg font-medium text-white bg-white/10 transition";
            lucide.createIcons();
        }

        function changeRoom(room) {
            currentRoom = room;
            socket.emit('join-room', room);
        }

        function sendChatMessage(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input-field');
            const text = input.value.trim();
            if (!text || !currentUser) return;

            socket.emit('send-message', { room: currentRoom, id: socket.id, sender: currentUser.name, text: text });
            input.value = '';
        }

        function appendMsg(sender, text, isSelf) {
            const box = document.getElementById('chat-messages-box');
            const html = `
                <div class="flex items-start space-x-2 ${isSelf ? 'justify-end' : ''} animate-apple-bounce">
                    <div class="${isSelf ? 'bg-cyberGreen/10 border-cyberGreen/20' : 'bg-white/5 border-appleBorder'} border p-2.5 rounded-xl max-w-xs">
                        <div class="flex items-center ${isSelf ? 'justify-end' : ''} space-x-2 mb-0.5">
                            <span class="text-[9px] text-slate-400 font-mono">Hozir</span>
                            <span class="text-[11px] font-semibold ${isSelf ? 'text-cyberGreen' : 'text-white'}">${sender}</span>
                        </div>
                        <p class="text-xs text-slate-200">${text}</p>
                    </div>
                </div>
            `;
            box.insertAdjacentHTML('beforeend', html);
            box.scrollTop = box.scrollHeight;
        }

        function submitBattle() {
            const code = document.getElementById('battle-code').value.trim();
            if(!code) return;
            alert("Kod muvaffaqiyatli tarqatildi!");
            document.getElementById('battle-code').value = '';
        }

        lucide.createIcons();
    </script>
</body>
</html>
