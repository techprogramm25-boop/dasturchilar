<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_CORE // Firebase Production Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK v9 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        appleDark: '#030712',
                        appleCard: 'rgba(15, 23, 42, 0.9)',
                        appleBorder: 'rgba(255, 255, 255, 0.08)',
                        cyberGreen: '#00ff66',
                        cyberBlue: '#00f0ff',
                    },
                    keyframes: {
                        appleBounce: {
                            '0%': { opacity: '0', transform: 'translateY(15px) scale(0.97)' },
                            '100%': { opacity: '1', transform: 'translateY(0) scale(1)' },
                        }
                    },
                    animation: {
                        'apple-bounce': 'appleBounce 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #030712; color: #f3f4f6; overflow-x: hidden; }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(13, 18, 32, 0.85); backdrop-filter: blur(30px); border: 1px solid rgba(255, 255, 255, 0.08); }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 2px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-cyberGreen selection:text-black">

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="fixed inset-0 bg-black/90 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full border border-appleBorder space-y-4 animate-apple-bounce shadow-2xl">
            <div class="text-center space-y-1">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyberGreen to-cyberBlue mx-auto flex items-center justify-center text-black font-bold">
                    <i data-lucide="shield-check" class="w-5 h-5"></i>
                </div>
                <h2 class="text-sm font-bold text-white tracking-tight">CYBER_CORE Authentication</h2>
                <p class="text-slate-400 text-[11px]">Tizimga kirish uchun ma'lumotlarni kiriting.</p>
            </div>
            
            <form onsubmit="handleLogin(event)" class="space-y-3">
                <div>
                    <label class="block text-[10px] font-mono text-slate-400 mb-1 uppercase">Ism va Familiya</label>
                    <input type="text" id="auth-name" required placeholder="Yusufxon Axmatov" class="w-full bg-black/50 border border-appleBorder rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-cyberGreen">
                </div>
                <div>
                    <label class="block text-[10px] font-mono text-slate-400 mb-1 uppercase">Telefon (+998)</label>
                    <input type="text" id="auth-phone" required placeholder="+998 (90) - 123 - 45 - 67" oninput="formatPhone(this)" class="w-full bg-black/50 border border-appleBorder rounded-xl px-3 py-2 text-xs font-mono text-cyberGreen focus:outline-none focus:border-cyberGreen">
                </div>
                <button type="submit" class="w-full py-2.5 rounded-xl bg-cyberGreen text-black font-semibold text-xs hover:opacity-90 transition flex items-center justify-center space-x-2">
                    <span>Tizimga Kirish</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app-wrapper" class="hidden min-h-screen flex flex-col">
        <header class="sticky top-0 z-40 glass-panel border-b border-appleBorder px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-7 h-7 rounded-lg bg-cyberGreen flex items-center justify-center text-black font-bold">
                    <i data-lucide="shield" class="w-4 h-4"></i>
                </div>
                <span class="text-xs font-bold tracking-wider text-white">CYBER_CORE</span>
            </div>

            <nav class="flex items-center space-x-1 bg-black/40 p-1 rounded-xl border border-appleBorder text-xs">
                <button onclick="switchTab('overview')" id="nav-overview" class="px-3 py-1.5 rounded-lg font-medium text-white bg-white/10 transition flex items-center space-x-1.5">
                    <i data-lucide="home" class="w-3.5 h-3.5"></i><span>Asosiy</span>
                </button>
                <button onclick="switchTab('chat')" id="nav-chat" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition flex items-center space-x-1.5">
                    <i data-lucide="message-square" class="w-3.5 h-3.5"></i><span>Global Chat</span>
                </button>
                <button onclick="switchTab('battle')" id="nav-battle" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition flex items-center space-x-1.5">
                    <i data-lucide="cpu" class="w-3.5 h-3.5"></i><span>Battle & Token</span>
                </button>
                <button onclick="switchTab('about')" id="nav-about" class="px-3 py-1.5 rounded-lg font-medium text-slate-400 hover:text-white transition flex items-center space-x-1.5">
                    <i data-lucide="info" class="w-3.5 h-3.5"></i><span>About</span>
                </button>
            </nav>

            <div class="flex items-center space-x-2 text-xs font-mono">
                <span class="px-2.5 py-1 rounded-full bg-cyberGreen/10 border border-cyberGreen/20 text-cyberGreen flex items-center space-x-1.5">
                    <span class="w-1.5 h-1.5 rounded-full bg-cyberGreen animate-ping"></span>
                    <span>Online: <strong id="real-online-count" class="text-white">1</strong></span>
                </span>
            </div>
        </header>

        <main class="flex-1 max-w-5xl w-full mx-auto p-4 space-y-4">
            <!-- OVERVIEW -->
            <section id="tab-overview" class="space-y-4 animate-apple-bounce">
                <div class="glass-panel p-6 rounded-2xl space-y-3">
                    <div class="inline-flex items-center space-x-1.5 px-2.5 py-1 rounded-full bg-cyberGreen/10 text-cyberGreen text-[10px] font-mono">
                        <i data-lucide="terminal" class="w-3 h-3"></i><span>Firebase Cloud Active</span>
                    </div>
                    <h1 class="text-xl font-bold text-white">Professional Kiberxavfsizlik & Dasturlash Ekotizimi</h1>
                    <p class="text-slate-400 text-xs leading-relaxed">Sizning Firebase bazangiz orqali dunyoning istalgan nuqtasidan xabarlar almashish va Code Battle tokenlari.</p>
                </div>
            </section>

            <!-- GLOBAL CHAT -->
            <section id="tab-chat" class="hidden space-y-3 animate-apple-bounce">
                <div class="glass-panel p-4 rounded-2xl h-[520px] flex flex-col justify-between">
                    <div class="flex items-center justify-between pb-3 border-b border-appleBorder gap-2 overflow-x-auto">
                        <span class="text-[11px] font-mono text-slate-400 uppercase flex items-center space-x-1"><i data-lucide="hash" class="w-3 h-3"></i><span>Xonalar:</span></span>
                        <div class="flex gap-1.5">
                            <button onclick="changeRoom('python')" class="room-btn px-2.5 py-1 rounded-lg bg-cyberGreen text-black text-[11px] font-semibold">Python</button>
                            <button onclick="changeRoom('javascript')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-slate-300 text-[11px]">JavaScript</button>
                            <button onclick="changeRoom('csharp')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-slate-300 text-[11px]">C#</button>
                            <button onclick="changeRoom('lua')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-slate-300 text-[11px]">Lua</button>
                            <button onclick="changeRoom('security')" class="room-btn px-2.5 py-1 rounded-lg bg-white/5 border border-appleBorder text-rose-400 text-[11px]">Xakerlik</button>
                        </div>
                    </div>

                    <div id="chat-messages-box" class="flex-1 overflow-y-auto space-y-2.5 py-3 pr-1 text-xs"></div>

                    <form onsubmit="sendChatMessage(event)" class="pt-3 border
